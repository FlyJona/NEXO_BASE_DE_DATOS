# NEXO: PostgreSQL + PostgREST. Valores en .env (copia de .env.example; ver README).
name: nexo

services:
  db:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?Falta POSTGRES_SUPERUSER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Falta POSTGRES_SUPERUSER_PASSWORD en .env}
      # Las lee docker/postgres/init/01_roles.sh al crear los roles.
      NEXO_MIGRATOR_PASSWORD: ${NEXO_MIGRATOR_PASSWORD:?Falta NEXO_MIGRATOR_PASSWORD en .env}
      NEXO_APP_PASSWORD: ${NEXO_APP_PASSWORD:?Falta NEXO_APP_PASSWORD en .env}
      PGRST_AUTHENTICATOR_PASSWORD: ${PGRST_AUTHENTICATOR_PASSWORD:?Falta PGRST_AUTHENTICATOR_PASSWORD en .env}
      TZ: America/Mexico_City
      PGTZ: America/Mexico_City
    volumes:
      - nexo_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Solo en 127.0.0.1: lo necesita la app PHP de XAMPP, que corre fuera de Docker.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Conexión interna por el nombre del servicio; nunca con el superusuario.
      PGRST_DB_URI: postgres://authenticator:${PGRST_AUTHENTICATOR_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?Falta PGRST_JWT_SECRET en .env}
      PGRST_SERVER_PORT: 3000
      # Servidor de administración: /live (proceso vivo) y /ready (conectado a PostgreSQL).
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_DB_MAX_ROWS: 500
    # La imagen de PostgREST no trae shell ni curl, así que no admite healthcheck interno:
    # scripts/check_connection.ps1 consulta /ready desde el equipo.
    ports:
      - "127.0.0.1:${POSTGREST_HOST_PORT:-3000}:3000"
      - "127.0.0.1:${POSTGREST_ADMIN_HOST_PORT:-3001}:3001"

volumes:
  nexo_pgdata:
